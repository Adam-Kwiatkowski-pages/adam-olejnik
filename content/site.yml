hero:
  image: /src/assets/images/hero-excavator.jpg
  image_alt: Koparka kołowa podczas pracy na placu budowy
  heading: Test
  body: Profesjonalne usługi koparką kołową oraz transport wywrotką 3-osiową z
    hydroburtą. Realizuję zlecenia dla firm i osób prywatnych - szybko, solidnie
    i w konkurencyjnych cenach.
  cta_primary: Zadzwoń po wycenę
  cta_secondary: Zobacz usługi na OLX
  note: Szybkie terminy • Elastyczne godziny pracy
services:
  eyebrow: Specjalizacje
  heading: Czym się zajmuję
  items:
    - title: Usługi koparką
      description: Wszechstronne prace ziemne i załadunkowe - idealne na place budowy
        oraz prace porządkowe.
      image: /src/assets/images/excavator.jpg
      image_alt: Koparka kołowa wykonująca wykop na placu budowy
    - title: Usługi transportowe
      description: Transport materiałów, wywóz ziemi i gruzu z budowy.
      image: /src/assets/images/dump-truck.jpg
      image_alt: Wywrotka 3-osiowa z hydroburtą podczas rozładunku
    - title: Wynajem zagęszczarki
      description: Idealna do prac brukarskich, przygotowania pod kostkę, tarasy,
        podjazdy, ścieżki oraz zagęszczania gruntu i podsypki.
      image: /src/assets/images/leveller.jpg
      image_alt: Zagęszczarka płytowa do zagęszczania gruntu i kostki brukowej
scope:
  eyebrow: Zakres usług
  heading: Kompleksowe prace ziemne
  body: Od precyzyjnych wykopów pod fundamenty po przygotowanie terenu pod
    inwestycję - wykonuję pełen zakres prac ziemnych dla firm i klientów
    indywidualnych.
  items:
    - Wykopy pod fundamenty, budynki, szamba, przyłącza wod.-kan., baseny
    - Kopanie stawów i oczek wodnych
    - Wyrywanie karp
    - Wyburzenia i rozbiórki
    - Niwelacja i korytowanie terenu
    - Załadunek materiałów sypkich
    - Wywóz ziemi i gruzu z budowy
    - Przygotowanie terenu pod kostkę brukową, drogi dojazdowe i place
equipment:
  eyebrow: Sprzęt
  heading: Koparka kołowa z 3 łyżkami
  body: Odpowiednie narzędzie do każdego zadania - od precyzyjnych wykopów po
    profilowanie terenu.
  buckets:
    - icon: shovel
      title: Łyżka skarpowa
      description: Do wyrównywania i profilowania terenu oraz skarp.
    - icon: cog
      title: Łyżka z zębami
      description: Do kopania w twardym i zwięzłym gruncie.
    - icon: wrench
      title: Wąska łyżka
      description: Idealna do fundamentów i przyłączy wod.-kan.
  callout:
    heading: Wynajem zagęszczarki 90 kg
    body: Solidne zagęszczanie gruntu i kostki brukowej - dostępne do wynajęcia
      razem z usługą lub osobno.
transport:
  image: /src/assets/images/dump-truck.jpg
  image_alt: Wywrotka 3-osiowa 6x6 z hydroburtą rozładowująca materiał sypki
  eyebrow: Transport materiałów
  heading: Wywrotka 3-osiowa 6x6 z hydroburtą
  body: Kiprowanie na bok lub tył, przewóz ładunków sypkich z dowozem na miejsce.
    Dowóz materiałów oraz wywóz ziemi i gruzu z budowy.
  materials:
    - Piasek 0/2
    - Żwir 2/16
    - Żwir 16-32
    - Kruszywo
    - Ziemia ogrodowa
    - Gruz
    - Beton suchy
    - Kruszywo betonowe
    - Mieszanka
    - Kamień
    - Piasek zasypowy
    - Pospółka
